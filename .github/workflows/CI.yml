name: CI

# Two tiers, the same in every Tree* repository. A pull request runs the
# Linux cells only, uninstrumented: the full suite has already run on the
# author's machine (macOS, arm64), so what CI adds there is x86-64 Linux,
# a clean environment and bounds checks. A push to `main`, the weekly
# schedule and a manual dispatch run the whole matrix, macOS and coverage
# included. Markdown and `docs/` changes run nothing: no test reads them,
# and the doctests run in Documentation.yml. Tags are not tested: TagBot
# tags a commit that has already passed on `main`.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  # Weekly, for what changes without a push here: the registry, and
  # TreeAMR's releases. The Tree* repositories are staggered by 20
  # minutes so that their macOS cells do not queue behind each other
  # (five run at once per account).
  schedule:
    - cron: "20 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    # The MPI test launches `mpiexec` subprocesses of MPICH_jll, the
    # default binary of MPI.jl, which needs nothing installed or set
    # here; each launch has a deadline of its own in `mpi_tests.jl`, but
    # a rank stuck outside it would otherwise hold the runner for the
    # default six hours.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ["1.13"]
        # macOS only off pull requests (see `on:` above).
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macOS-latest"]') }}
        # The suite must pass threaded as well as serial. The MPI test
        # spawns its own subprocesses either way (the ranks at one
        # thread each, whatever this says); this is what runs the rest
        # of the suite on threads.
        threads: [1, 4]
    # Coverage on one cell, macOS at one thread, and never on a pull
    # request: it is bought once per push to `main`, where the badge
    # reads it. Not a Linux cell: `--code-coverage` together with
    # `--check-bounds=yes` miscompiles on GitHub's AVX-512 Zen 4/5
    # runners under Julia 1.13 (TreeGeneralizedHarmonic's CI.yml has the
    # probes). Not a threaded cell, the expensive one.
    env:
      COVERAGE: ${{ matrix.os == 'macOS-latest' && matrix.threads == 1 && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      # `check_bounds: yes` is the action's default, stated as TreeAMR
      # states it: TreeAMR's transfer kernel reads `@inbounds`, and this
      # suite exercises it through every save and load.
      - uses: julia-actions/julia-runtest@v1
        with:
          check_bounds: 'yes'
          coverage: ${{ env.COVERAGE }}
        env:
          JULIA_NUM_THREADS: ${{ matrix.threads }}
      - uses: julia-actions/julia-processcoverage@v1
        if: env.COVERAGE == 'true'
      - uses: codecov/codecov-action@v7
        if: env.COVERAGE == 'true'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage should not turn a green test run red.
          fail_ci_if_error: false
