name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    # The MPI test launches `mpiexec` subprocesses of MPICH_jll, the
    # default binary of MPI.jl, which needs nothing installed or set
    # here; each launch has a deadline of its own in `mpi_tests.jl`, but
    # a rank stuck outside it would otherwise hold the runner for the
    # default six hours.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ["1.11", "1"]
        os: [ubuntu-latest, macOS-latest]
        # The suite must pass threaded as well as serial. The MPI test
        # spawns its own subprocesses either way (the ranks at one
        # thread each, whatever this says); this is what runs the rest
        # of the suite on threads.
        threads: [1, 4]
    # Coverage exactly on the single-threaded cells. Turning coverage
    # off on the `threads: 4` cells makes CI faster, because those are
    # the expensive ones.
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      # `check_bounds: yes` is the action's default, stated as TreeAMR
      # states it: TreeAMR's transfer kernel reads `@inbounds`, and this
      # suite exercises it through every save and load.
      - uses: julia-actions/julia-runtest@v1
        with:
          check_bounds: 'yes'
          coverage: ${{ matrix.threads == 1 }}
        env:
          JULIA_NUM_THREADS: ${{ matrix.threads }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.threads == 1
      - uses: codecov/codecov-action@v7
        if: matrix.threads == 1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage should not turn a green test run red.
          fail_ci_if_error: false
